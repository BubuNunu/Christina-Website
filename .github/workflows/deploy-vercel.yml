name: Deploy to Vercel

# Deploys from GitHub Actions with Rui's Vercel token, so commits by Sherry and
# Claude go live too (Vercel's free plan only auto-deploys the owner's commits
# from a private repo). Needs the repo secret VERCEL_TOKEN; does nothing until
# it is added.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: "vercel"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check Vercel is set up
        id: check
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Vercel secrets not added yet, skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        if: steps.check.outputs.ready == 'true'
        run: npm install --global vercel@latest

      - name: Link the Vercel project
        if: steps.check.outputs.ready == 'true'
        run: vercel link --yes --project sherry-ux-work-website --token="$VERCEL_TOKEN"

      - name: Pull Vercel settings
        if: steps.check.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.check.outputs.ready == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
